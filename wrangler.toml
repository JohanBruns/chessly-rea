# Cloudflare Pages: App aus dist/, Konten und Lernstand in D1, Videos über functions/ aus dem privaten R2-Bucket.
name = "chessly-rea"
pages_build_output_dir = "dist"
compatibility_date = "2025-06-01"

[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "chessly-rea-videos"

[[d1_databases]]
binding = "DB"
database_name = "chessly-rea"
# Ausgabe von „npx wrangler d1 create chessly-rea“ (siehe README „Aufs iPhone“)
database_id = "717a3893-4e7d-4b6b-a0ac-311872592d80"
migrations_dir = "migrations"

# Secrets (nicht im Repo):
# ADMIN_EMAIL bekommt die Links aus „Passwort vergessen“. Ohne eigene Domain muss das die Adresse des Resend-Kontos sein.
#   npx wrangler pages secret put ADMIN_EMAIL --project-name chessly-rea
# RESEND_API_KEY: npx wrangler pages secret put RESEND_API_KEY --project-name chessly-rea
